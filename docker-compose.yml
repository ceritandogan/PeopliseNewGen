services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peoplise
      POSTGRES_USER: peoplise
      POSTGRES_PASSWORD: peoplise_dev_only
    ports:
      - "5432:5432"
    volumes:
      - peoplise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplise -d peoplise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peoplise-postgres-data:
